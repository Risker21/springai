server:
  port: 8080
spring:
  application:
    name: springai
  data:
    redis:
      client-type: jedis
      host: localhost
      port: 6378

  ai:
    model:
      embedding: openai
    vectorstore:
      redis:
        initialize-schema: true #是否在启动时初始化（创建）向量索引
        index-name: test_vector_index # 向量索引名称
        prefix: "test_" # 向量索引前缀
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://ws-fpol7e8wt3h1cjo2.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      chat:
        model: qwen3.7-plus
      embedding:
        model: qwen3.7-text-embedding
        dimensions: 2048 # 2048维向量
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3.5:0.8b

logging:
  level:
    org.springframework.ai: info # debug